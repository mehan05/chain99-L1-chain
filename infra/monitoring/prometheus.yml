global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "chain99-validators"
    static_configs:
      - targets:
          - "127.0.0.1:26660" # Node 1 CometBFT metrics
          - "127.0.0.1:26670" # Node 2 CometBFT metrics
          - "127.0.0.1:26680" # Node 3 CometBFT metrics
          - "127.0.0.1:26690" # Node 4 CometBFT metrics
        labels:
          network: "chain99-mainnet"

  - job_name: "chain99-nodes-system"
    static_configs:
      - targets:
          - "127.0.0.1:9100" # Node Exporter

