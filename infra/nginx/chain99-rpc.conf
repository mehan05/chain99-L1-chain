# ====================================================================
# Chain99 L1 — Production NGINX Reverse Proxy with DDoS Rate Limiting
# ====================================================================

limit_req_zone $binary_remote_addr zone=chain99_rpc_limit:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=chain99_conn_limit:10m;

upstream chain99_evm_backend {
    server 127.0.0.1:8545;
    keepalive 64;
}

upstream chain99_ws_backend {
    server 127.0.0.1:8546;
    keepalive 64;
}

upstream chain99_comet_backend {
    server 127.0.0.1:26657;
    keepalive 64;
}

server {
    listen 80;
    server_name rpc.chain99.network;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rpc.chain99.network;

    # SSL Configuration (Replace with valid Let's Encrypt certificates)
    ssl_certificate /etc/letsencrypt/live/rpc.chain99.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc.chain99.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Rate Limiting & Protection
    limit_req zone=chain99_rpc_limit burst=100 nodelay;
    limit_conn chain99_conn_limit 20;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;

    # Primary EVM JSON-RPC endpoint
    location / {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        proxy_pass http://chain99_evm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # WebSocket JSON-RPC endpoint
    location /ws {
        proxy_pass http://chain99_ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # CometBFT Consensus Status & Explorer RPC
    location /comet {
        rewrite ^/comet/(.*) /$1 break;
        proxy_pass http://chain99_comet_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}

